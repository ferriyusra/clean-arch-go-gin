name: CI

on:
  push:
    branches: [main]
    # With only `branches` listed, a tag push would not run CI at all, and the
    # image job below would never see a release.
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-go reads go.mod's `toolchain` line when there is one, and only
      # falls back to the `go` line otherwise. The `go` line is a minimum for
      # consumers of the module. Building with it exactly would ship the .0
      # standard library and miss every security fix in the later patches.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Show Go version
        run: go version

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Check generated mocks are current
        run: |
          make mocks
          git diff --exit-code -- internal/repository/mock internal/service/mock

      # The race detector needs cgo, which is why this runs here rather than in
      # the default `make test` developers use locally.
      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Two constraints keep these versions moving together. Action v6 refuses
      # any golangci-lint v2, so the action must be v7 or later. And
      # golangci-lint refuses a module whose `go` directive is newer than the Go
      # it was built with, so the linter must be built with at least the Go
      # that go.mod declares. v2.13 and later declare go 1.26 themselves, so
      # their release binaries cannot have been built with anything older.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  # Pushes to main and v* tags hand the tested commit to Jenkins, which builds
  # and publishes the image. The `if` is what keeps pull requests out, because
  # `needs:` alone would run this after a PR's checks too, so keep it. The Jenkins
  # credentials come from the `jenkins` environment inside the called workflow;
  # nothing is passed from here.
  image:
    needs: [build-and-test, lint]
    if: github.event_name == 'push'
    uses: ./.github/workflows/jenkins.yml
